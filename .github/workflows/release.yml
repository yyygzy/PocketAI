name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # 鍥藉唴缃戠粶鍙彇娑堟敞閲婁互涓嬩袱琛屽姞閫?Electron + NSIS 璧勬簮涓嬭浇
        # 锛堟敞鎰忥細env 鍧椾笉鑳藉叏娉ㄩ噴鐣欑┖锛孏itHub Actions 浼氳В鏋愭姤閿欙級
        # env:
        #   ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        #   ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npm ci

      - name: Build & Package (NSIS + Portable)
        run: npm run dist -- --win --x64
        env:
          # electron-builder GitHub provider 闇€瑕?GH_TOKEN 鎵嶈兘涓婁紶 Release
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts for debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/*

      - name: Create GitHub Release
        # 浠?tag 鎺ㄩ€佹椂鍙戝竷锛涙墜鍔ㄨЕ鍙戯紙workflow_dispatch锛夊彧楠岃瘉鏋勫缓
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 鍏抽敭锛歟lectron-updater NSIS 鏇存柊闇€瑕?latest.yml + nsis.zip + blockmap
          # portable exe 浣滀负棰濆闄勪欢
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: false

  build-macos:
    name: Build macOS (Intel + Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build & Package (dmg + zip, x64 + arm64)
        run: |
          npx electron-vite build
          npx electron-builder --mac --x64 --arm64 --publish never
        env:
          # 无证书时跳过签名（identity:null），CI 只构建产物
          # 证书就绪后：取消注释 APPLE_* env + package.json 的 afterSign
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload artifacts for debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-files-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.yml

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
          generate_release_notes: true
          draft: false
          prerelease: false

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Linux 原生模块需要 postinstall 的 install-app-deps 处理
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build & Package (AppImage x64)
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts for debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-files-linux
          path: |
            dist/*.AppImage
            dist/*.blockmap
            dist/*.yml

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.blockmap
            dist/*.yml
          generate_release_notes: true
          draft: false
          prerelease: false

