name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --publish never: build job 只产出, 不上传 Release (统一由 release job 做)
      - run: npm run dist -- --win --x64 --publish never

      - name: Upload artifacts for debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-files-win
          path: dist/*
          if-no-files-found: ignore

  build-macos:
    name: Build macOS (Intel + Apple Silicon)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - run: |
          npx electron-vite build
          npx electron-builder --mac --x64 --arm64 --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload artifacts for debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-files-macos
          path: dist/*
          if-no-files-found: ignore

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - run: npm run dist:linux -- --publish never

      - name: Upload artifacts for debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-files-linux
          path: dist/*
          if-no-files-found: ignore

  release:
    name: Create GitHub Release (all platforms)
    needs: [build, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-files-win
          path: dist/win
      - uses: actions/download-artifact@v4
        with:
          name: dist-files-macos
          path: dist/mac
      - uses: actions/download-artifact@v4
        with:
          name: dist-files-linux
          path: dist/linux

      - name: Flatten to dist/ (exclude debug files)
        run: |
          mkdir -p dist/all
          cp dist/win/* dist/mac/* dist/linux/* dist/all/ 2>/dev/null || true
          # electron-builder 调试产物 + CI locale 导致的中文 yml, 不应进 Release
          rm -f dist/all/builder-debug.yml dist/all/最新.yml
          find dist/all -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/all/*
          generate_release_notes: true
          draft: false
          prerelease: false
