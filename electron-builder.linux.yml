# Linux AppImage 构建配置（与 package.json build 段平行的独立配置）
# 用法：npm run dist:linux
# 关键差异：files 排除规则保留 linux/linuxmusl prebuilds、排除 darwin/win32
appId: ai.pocket.desktop
productName: Moxia
asar: true
asarUnpack:
  - node_modules/better-sqlite3-multiple-ciphers/**/*.node
  - node_modules/better-sqlite3/**/*.node
  # 对齐 package.json build.asarUnpack：这两个是运行时从磁盘加载原生库的，
  # 留在 asar 里会加载失败（onnxruntime-node 的 .so 在 bin/napi-v*/linux-x64/ 下）
  - node_modules/sqlite-vec*/**/*.{dll,dylib,so}
  - node_modules/onnxruntime-node/**
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  # 运行时通过 app.getAppPath() + build/icon/xxx 读取（托盘/菜单/浮窗/窗口图标），
  # 不打包会导致打包后 nativeImage 为空、托盘直接跳过初始化
  - build/icon/**/*
  - extensions/**/*
  - node_modules/**/*
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
  - '!**/node_modules/*.d.ts'
  - '!**/node_modules/.cache'
  - '!**/node_modules/@types'
  # Linux 版：排除 macOS/Windows 的 sqlite prebuilds，保留 linux(-musl) 运行时
  - '!**/node_modules/{better-sqlite3-multiple-ciphers,better-sqlite3}/prebuilds/{darwin,win32}-*.node'
linux:
  target:
    - target: AppImage
      arch:
        - x64
    # 同时出 .deb：装到 /opt，由系统包管理器安装，不依赖 FUSE2，
    # Ubuntu 24.04+ 双击即可安装（AppImage 在这些版本上需要额外装 libfuse2t64）
    - target: deb
      arch:
        - x64
  # rpm（Fedora/openSUSE/UOS/麒麟）不在默认目标里：fpm 依赖宿主的 rpmbuild，
  # 缺 rpm-build 会让整次 dist:linux 失败。需要时单独跑 npm run dist:linux:rpm
  category: Utility
  icon: build/icon/icon-256.png
  # deb/rpm 的 Maintainer 字段必填，electron-builder 不会从 package.json 的纯字符串 author 推断邮箱
  maintainer: Moxia <3854313@qq.com>
  artifactName: Moxia-${version}-Linux-${arch}.${ext}
publish:
  provider: github
  owner: yyygzy
  repo: PocketAI
  channel: latest
